[workspace]
members = ["macros"]

[package]
name = "crustcrab"
edition = "2024"
default-run = "crustcrab"

[profile.lto]
inherits = "release"
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[dependencies]
bitfield = "0.19.5"
bitflags = { version = "2.13.2", features = ["serde"] }
bitvec = { version = "1.1.1", default-features = false, features = ["serde"] }
bon = "3.10.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
env_logger = "0.11.11"
generic-array = "1.4.5"
image = "0.25.10"
indexmap = "2.14.2"
macros = { path = "macros" }
nalgebra = { version = "0.35.0", features = ["bytemuck", "serde-serialize"] }
noise = "0.9.0"
pollster = "1.0.1"
postcard = { version = "1.1.3", default-features = false }
rand = { version = "0.10.3", default-features = false }
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
thiserror = "2.0.20"
toml = "1.1.6"
uuid = { version = "1.26.1", features = ["fast-rng", "serde", "v4"] }
walkdir = "2.5.0"
wgpu = "30.0.1"
winit = "0.31.0-beta.3"
